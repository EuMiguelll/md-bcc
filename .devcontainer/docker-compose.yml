services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # compartilha a rede do MySQL: o banco fica em 127.0.0.1:3306
    network_mode: service:db

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: megadados
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
